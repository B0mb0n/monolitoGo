services:

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx-gateway

  # ---------- Reverse proxy / Load balancer (nginx) ----------
  # Único punto de entrada: el frontend le habla a este contenedor (8080)
  # y él reparte entre los middlewares.
  nginx-gateway:
    build: ./nginx-gateway
    container_name: nginx-gateway
    ports:
      - "8080:80"
    depends_on:
      - middleware-1
      - middleware-2

  # ---------- Middleware (descubre servicios en Consul + load balancer), 2 réplicas ----------
  # Ya no publican puertos al host: solo nginx-gateway puede llegar a ellos.

  middleware-1:
    build: ./middleware
    container_name: middleware-1
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      - consul

  middleware-2:
    build: ./middleware
    container_name: middleware-2
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      - consul

  # ---------- Consul (service registry + health checks) ----------
  # Modo dev: un solo nodo, en memoria. UI en http://localhost:8500/ui

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"

  # ---------- Backend: port-scan (2 réplicas) ----------
  port-scan-1:
    build:
      context: ./services
      dockerfile: port-scan/Dockerfile
    container_name: port-scan-1
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: port_scan
      INSTANCE_ID: port-scan-1
      SERVICE_PORT: 9001
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_started

  port-scan-2:
    build:
      context: ./services
      dockerfile: port-scan/Dockerfile
    container_name: port-scan-2
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: port_scan
      INSTANCE_ID: port-scan-2
      SERVICE_PORT: 9001
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_started

  # ---------- Backend: http-scan ----------
  http-scan-1:
    build:
      context: ./services
      dockerfile: http-scan/Dockerfile
    container_name: http-scan-1
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: http_scan
      INSTANCE_ID: http-scan-1
      SERVICE_PORT: 9002
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_started

  # ---------- Backend: tls-scan ----------
  tls-scan-1:
    build:
      context: ./services
      dockerfile: tls-scan/Dockerfile
    container_name: tls-scan-1
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: tls_scan
      INSTANCE_ID: tls-scan-1
      SERVICE_PORT: 9003
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_started

  # ---------- Base de datos compartida ----------
  db:
    image: postgres:16-alpine
    container_name: monolito-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monolito
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
