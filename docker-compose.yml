services:

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx-gateway

  # ---------- Reverse proxy / Load balancer (nginx) ----------
  # Único punto de entrada: el frontend le habla a este contenedor (8080)
  # y él reparte entre los middlewares.
  nginx-gateway:
    build: ./nginx-gateway
    container_name: nginx-gateway
    ports:
      - "8080:80"
    depends_on:
      - middleware-1
      - middleware-2

  # ---------- Middleware (service discovery + load balancer), 2 réplicas ----------
  # Ya no publican puertos al host: solo nginx-gateway puede llegar a ellos.
  middleware-1:
    build: ./middleware
    container_name: middleware-1
    depends_on:
      - port-scan-1
      - port-scan-2
      - http-scan-1
      - tls-scan-1

  middleware-2:
    build: ./middleware
    container_name: middleware-2
    depends_on:
      - port-scan-1
      - port-scan-2
      - http-scan-1
      - tls-scan-1


  # ---------- Backend: port-scan (2 réplicas) ----------
  port-scan-1:
    build: ./services/port-scan
    container_name: port-scan-1
    depends_on:
      db:
        condition: service_healthy

  port-scan-2:
    build: ./services/port-scan
    container_name: port-scan-2
    depends_on:
      db:
        condition: service_healthy

  # ---------- Backend: http-scan ----------
  http-scan-1:
    build: ./services/http-scan
    container_name: http-scan-1
    depends_on:
      db:
        condition: service_healthy

  # ---------- Backend: tls-scan ----------
  tls-scan-1:
    build: ./services/tls-scan
    container_name: tls-scan-1
    depends_on:
      db:
        condition: service_healthy

  # ---------- Base de datos compartida ----------
  db:
    image: postgres:16-alpine
    container_name: monolito-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monolito
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
